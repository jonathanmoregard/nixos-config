# .github/workflows/ci.yml
#
# CI workflow. Runs on `pull_request` (PR-branch code).
# Allowed: builds, tests, lint, eval.
# Forbidden: labelling, AI review, anything that gates merge — those
# live in gate.yml on `pull_request_target`.
#
# Trust boundary: this workflow's permissions are read-only for content;
# merge-gating logic lives in gate.yml (pull_request_target).
#
# Fork policy: this repo does NOT accept external contributions. Every
# job below is gated on either a push event OR a PR whose head lives in
# this same repository. Fork PRs cause every job to skip — no PR code
# from outside this repo runs in CI. close-fork-prs.yml handles the
# auto-close so fork PRs don't sit open silently.
#
# Runner: GitHub-hosted (ubuntu-latest). Public repo = unlimited free
# minutes. KVM nested-virt available since Feb 2023; verified via the
# DETERMINATE_NIX_KVM env exported by determinate-nix-action.
#
# Fast-path: a `preflight` job runs the same denylist regex as gate.yml
# and emits `risk=TRIVIAL` for docs-only PRs. Heavy STEPS inside the
# downstream jobs (flake-check, build-tuxedo, vm-minimal, vm-graphical)
# are gated `if: needs.preflight.outputs.risk != 'TRIVIAL'`, so the
# job COMPLETES SUCCESS with no work — that keeps branch-protection
# required checks satisfied. Skipping the job itself would mark the
# required check as SKIPPED and block merge. Push:main events leave
# risk empty, so heavy steps always run on main.
#
# Disk: /nix is mounted on a loopback file backed by /mnt (~70GB
# free) instead of running jlumbroso/free-disk-space (which scrubs
# /usr/share/dotnet etc and takes ~2.5min per job). Loop mount: ~5s.
# Implementation lives in scripts/mount-nix-loop.sh (must run BEFORE
# determinate-nix-action).
#
# /tmp is bind-mounted onto /mnt via scripts/mount-tmp-loop.sh so the
# nix build sandbox AND QEMU NixOS-test runtime artifacts (qcow2 disks,
# screenshots, serial logs — several GB per lane) don't starve runner
# root. Pair with `env: TMPDIR=/mnt/tmp` on the heavy steps. Ordering:
# mount-tmp-loop → mount-nix-loop → free-root-disk → determinate-nix-
# action. Root-disk ENOSPC during vm-minimal lanes (the autodoro
# crash on run 26373588544 — worker died writing _diag log) is the
# specific failure mode this guards.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# NIX_CONFIG is parsed by Nix BEFORE any config file, so it survives
# cachix-action's later NIX_USER_CONF_FILES override that otherwise
# shadows /etc/nix/nix.conf for steps run after cachix loads.
# Belt-and-braces alongside extra-conf in the determinate-nix-action
# `with:` blocks: extra-conf covers steps before cachix; NIX_CONFIG
# covers steps after. Both layers point at the same workflow token.
#
# Substituter parallelism tuning: defaults (max-substitution-jobs=16,
# http-connections=25) cap CloudFront throughput when the
# runner's /nix/store misses hundreds of small paths the new closure
# needs. Bumping to 64/64 saturates the connection on high-latency
# CI links without hitting cachix throttling. narinfo-cache-positive-
# ttl=600 keeps cachix narinfo hot across the job but invalidates
# quickly enough to pick up new pushes (default is 30 days — fine for
# laptops, harmful for an active CI cache).
env:
  NIX_CONFIG: |
    access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    max-substitution-jobs = 64
    http-connections = 64
    narinfo-cache-positive-ttl = 600

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-fork-guards:
    name: verify fork-guards
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/check-fork-guards.sh

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    needs: verify-fork-guards
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      risk: ${{ steps.preflight.outputs.risk }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight TRIVIAL check (no nix, ~1s)
        id: preflight
        # Doc-only fast-path: if every changed file matches the safe
        # denylist below, emit risk=TRIVIAL and let heavy steps in
        # downstream jobs skip via
        # `if: needs.preflight.outputs.risk != 'TRIVIAL'`.
        # Push:main events skip the diff (no base SHA) and leave risk
        # empty so heavy steps always run on main.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "preflight: non-PR event, leaving risk empty (heavy steps run)"
            exit 0
          fi
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          # Fail-closed: if `git diff` itself errors (bad SHAs / shallow
          # clone), exit non-zero so the heavy steps run rather than
          # silently treating the empty result as TRIVIAL and skipping
          # required checks for an unverified PR.
          if ! git diff --name-only "$merge_base" "$HEAD_SHA" > /tmp/diff-files.txt; then
            echo "preflight: git diff failed, leaving risk empty (heavy steps run)"
            cat /tmp/diff-files.txt 2>/dev/null || true
            exit 0
          fi
          safe_re='(^|/)docs/|^proposals/|^README(\..*)?$|^CLAUDE\.md$|^pending_for_human\.md$|^\.gitignore$|^\.gitattributes$|^LICENSE([.\-].*)?$|^\.editorconfig$'
          unsafe=$(grep -Ev "$safe_re" /tmp/diff-files.txt || true)
          if [ -z "$unsafe" ]; then
            echo "preflight: every changed file is in the safe denylist — risk=TRIVIAL"
            echo "risk=TRIVIAL" >> "$GITHUB_OUTPUT"
          else
            echo "preflight: unsafe paths present, heavy steps will run"
            printf '%s\n' "$unsafe" | head -20 | sed 's/^/  /'
          fi

  flake-check:
    name: flake check (eval)
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    steps:
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
        with:
          # Belt-and-braces against intermittent HTTP 401 from
          # api.github.com when Nix fetches flake input tarballs.
          # Action auto-injects access-tokens from github-token, but
          # cachix-action later sets NIX_USER_CONF_FILES, reshaping the
          # conf chain Nix reads; the explicit extra-conf writes the
          # token to the path Nix actually consults at build time.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            max-substitution-jobs = 64
            http-connections = 64
            narinfo-cache-positive-ttl = 600
      # agenix-rekey's NixOS module references the per-host rekeyed dir
      # via `builtins.path { path = ../../secrets/rekeyed/<host>; }`,
      # producing a deterministic store path. Under `--no-build`,
      # Determinate Nix doesn't materialise that input source on a
      # fresh runner — the downstream nixos-system derivation eval then
      # hits `error: path '<hash>-<host>' is not valid` when computing
      # drvPath. Eagerly registering each rekeyed-dir produces the same
      # store hash builtins.path will compute, so the assertion
      # short-circuits to "path exists" and the check passes without
      # building anything else.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: |
          shopt -s nullglob
          for dir in secrets/rekeyed/*/; do
            # Strip trailing slash — `nix store add-path` derives the
            # store-name from basename, and "dir/" yields an empty name.
            nix store add-path "${dir%/}"
          done
      # check-eval-warnings.sh wraps `nix flake check --no-build
      # --all-systems` and FAILS on any unallowlisted lib.warn/warnIf
      # output. Rationale + allowlist mechanics in the script header;
      # born from the PR #117 incident (upstream warned about the exact
      # bug on every eval, invisibly, while it took the VM down).
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/check-eval-warnings.sh
      # worktree-sweep fail-closed contract: fixture bare repo +
      # worktrees + stubbed gh, asserting the sweeper deletes only
      # merged+old+clean+no-live-cwd and that a gh outage means zero
      # deletions (tests/worktree-sweep.nix). Tiny runCommand — seconds.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: nix build .#checks.x86_64-linux.worktree-sweep -L
      # Signal build-expiry probe contract: crafted app.asar fixtures
      # asserting max-selection over the zero decoys, that an expired
      # build still MEASURES (exit 0, negative days), and that an
      # unreadable expiry fails loud (tests/signal-expiry.nix). The
      # update-signal.yml bumper parses this tool's stdout, so a silent
      # misparse would either spam nixpkgs-bump PRs or go blind at
      # expiry. Tiny runCommand — seconds.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: nix build .#checks.x86_64-linux.signal-expiry -L
      # kitty session save/restore script contracts
      # (tests/kitty-scripts.nix): the single-line session-stub
      # invariant, pane 0's notice surviving as an argv element, grid
      # dispatch counting real panes only, the snapshot history ring,
      # and the pane-0 launcher never becoming pane 0's own command
      # (which would exec-loop the restore). Drives the real
      # derivations with fixture snapshots — boots nothing, runs in
      # seconds, so it lives here rather than as a vm-minimal lane.
      # The vm-kitty lane proves the topology comes back under a real
      # X session; this one proves the file formats and arithmetic that
      # lane cannot see. Every phase reproduces a link in the
      # 2026-09-04 incident chain, so a regression here is a regression
      # to a failure that actually cost a day's sessions.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: nix build .#checks.x86_64-linux.kitty-scripts -L
      # research-agent security sweep verdict logic
      # (tests/security-batch-research-agent.nix): seed, new CVE,
      # accepted, score regression, tool errors, against fake vulnix /
      # systemd-analyze. Tiny runCommand — seconds.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: nix build .#checks.x86_64-linux.security-batch-research-agent -L

  docs:
    # Validate that every `nix run .#<attr>` reference in this repo's
    # docs/comments/skills resolves against the current flake. Catches
    # the drift class where a flake attribute is renamed/removed but the
    # prose that documents it isn't updated — the exact failure mode
    # behind the agenix-rekey migration leaving `.#agenix -- edit`
    # references in flake.nix, dellan host config, and (now in-repo) the
    # nixos-agenix-secret skill.
    #
    # Scope: nixos-config only. The companion ~/.claude repo's content
    # is private and unreadable to the default GITHUB_TOKEN; the mirror
    # workflow that validates .claude content against
    # `jonathanmoregard/nixos-config@main` lives in the .claude repo's
    # own CI (Phase 2 of proposal #128). Adding a cross-repo lint here
    # would need a PAT with read access to .claude — tracked as a
    # follow-up; not load-bearing because every nixos-* skill that
    # references this flake now lives in-repo (home/claude-skills/).
    #
    # No build cost: pure `nix eval --apply 'x: null'` per unique
    # attribute, no realization. Total job runtime ~30-60s warm.
    # Background: proposals/2026-06-25-cross-repo-skill-staleness.md.
    name: docs (eval)
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    steps:
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # Same agenix-rekey prewarm flake-check uses — `nix eval` against a
      # nixosConfigurations attribute would otherwise hit `path X-dellan
      # is not valid` on a fresh runner.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: |
          shopt -s nullglob
          for dir in secrets/rekeyed/*/; do
            nix store add-path "${dir%/}"
          done
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/check-docs-commands.sh

  security-static:
    # Fast, offline, free security scanners (zizmor, actionlint,
    # gitleaks over full history, shellcheck, poutine) from
    # scripts/security-static.sh, pinned through flake.lock via
    # packages.security-static. ~1 s of scanning plus tool fetch from
    # cache.nixos.org. `--self-test` first proves every scanner still
    # fails on a planted probe (unpinned action, fake credential, shell
    # error), so a silently broken scanner can't pass as "clean".
    # Runs on TRIVIAL PRs too: docs-only diffs can still leak a secret.
    name: security-static
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # gitleaks scans the whole history, not just the PR tip.
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Scanner self-test (planted probes must fail)
        run: nix run .#security-static -- --self-test
      - name: Scan
        run: nix run .#security-static

  build-tuxedo:
    name: build tuxedo toplevel
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    permissions:
      contents: read
    steps:
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Pin to head SHA + explicit token. `gh run rerun` reuses the
          # original event payload, but GitHub's `refs/pull/<N>/merge`
          # virtual ref can lag-behind on rerun → actions/checkout
          # falls through to its credential-prompt path and dies with
          # "could not read Username for github.com: terminal prompts
          # disabled". head.sha is always resolvable and bypasses the
          # merge-ref propagation race.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disk before (baseline)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: df -h / /mnt 2>/dev/null || df -h /
      - name: Free root disk (dotnet/ghc/android/docker/codeql)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/free-root-disk.sh
      - name: Mount /tmp on /mnt bind
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/mount-tmp-loop.sh
      - name: Mount /nix on /mnt loopback (replaces free-disk-space)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/mount-nix-loop.sh
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
        with:
          # Belt-and-braces against intermittent HTTP 401 from
          # api.github.com when Nix fetches flake input tarballs.
          # Action auto-injects access-tokens from github-token, but
          # cachix-action later sets NIX_USER_CONF_FILES, reshaping the
          # conf chain Nix reads; the explicit extra-conf writes the
          # token to the path Nix actually consults at build time.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            max-substitution-jobs = 64
            http-connections = 64
            narinfo-cache-positive-ttl = 600
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: jonathanmoregard
          # Write token on push:main only. PR jobs run PR-head code, so a
          # token there could be exfiltrated or used to push NARs main
          # never built; PRs read the public cache without a token.
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # Push in the post step with a plain blocking `cachix push` of new
          # store paths. The default daemon gives its queue only ~60 s to
          # drain at job end, and a 3 GB zoom upload failed a green build.
          useDaemon: false
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        env:
          TMPDIR: /mnt/tmp
        run: |
          set -euo pipefail
          nix build .#nixosConfigurations.tuxedo.config.system.build.toplevel \
            --no-link --print-build-logs --keep-going
      - name: Disk after (post-build)
        if: always() && needs.preflight.outputs.risk != 'TRIVIAL'
        run: df -h / /mnt /tmp 2>/dev/null || df -h /

  vm-minimal:
    # Matrix fan-out: one lane per feature check derivation. Each lane
    # is independent (own VM boot), so a failure in `kitty` doesn't
    # block `keyring` reporting status. `fail-fast: false` keeps every
    # lane reporting even after one breaks.
    #
    # Lanes run in parallel with build-tuxedo, not after it, and
    # substitute from cachix (push:main uploads every new path). They used
    # to wait for a shared GHA /nix/store snapshot, but that snapshot was
    # ~16 GB against GHA's 10 GB repo cap: lanes never found it, and its
    # save step added minutes to (or hung) the critical path.
    #
    # No cache pre-probe job gates the lanes. When a lane's check is
    # already in cachix, `nix build` substitutes just that small output
    # after a ~1 min eval, so an unchanged lane stays cheap. A gating
    # probe cost every lane ~2.5 min of wall-clock to save that minute.
    #
    # Branch-protection required-check names are
    # `vm-minimal (<lane>)` — update protection rules in the GH UI
    # when adding/removing a lane.
    name: vm-minimal (${{ matrix.lane }})
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [base, desktop, keyring, kitty, claude-pane, autodoro, microvm, listen-tools, camera-relay, auto-deploy, klaffat-infra, klaffat-dependabot-caretaker, security-batch]
    steps:
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Disk before (baseline)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: df -h / /mnt 2>/dev/null || df -h /
      - name: Free root disk (dotnet/ghc/android/docker/codeql)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/free-root-disk.sh
      - name: Mount /tmp on /mnt bind
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/mount-tmp-loop.sh
      - name: Mount /nix on /mnt loopback (replaces free-disk-space)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: ./scripts/mount-nix-loop.sh
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
        with:
          # Belt-and-braces against intermittent HTTP 401 from
          # api.github.com when Nix fetches flake input tarballs.
          # Action auto-injects access-tokens from github-token, but
          # cachix-action later sets NIX_USER_CONF_FILES, reshaping the
          # conf chain Nix reads; the explicit extra-conf writes the
          # token to the path Nix actually consults at build time.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            max-substitution-jobs = 64
            http-connections = 64
            narinfo-cache-positive-ttl = 600
      # cachix is the cross-run cache: push:main runs upload every new
      # path, including VM-specific closures.
      - if: needs.preflight.outputs.risk != 'TRIVIAL'
        uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: jonathanmoregard
          # Write token on push:main only. PR jobs run PR-head code, so a
          # token there could be exfiltrated or used to push NARs main
          # never built; PRs read the public cache without a token.
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # Push in the post step with a plain blocking `cachix push` of new
          # store paths. The default daemon gives its queue only ~60 s to
          # drain at job end, and a 3 GB zoom upload failed a green build.
          useDaemon: false
      - name: Verify KVM
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        run: |
          test "${DETERMINATE_NIX_KVM:-}" = "1" || { echo "KVM not available"; exit 1; }
          ls -la /dev/kvm
      - name: Build vm-${{ matrix.lane }} (3 retries)
        if: needs.preflight.outputs.risk != 'TRIVIAL'
        env:
          TMPDIR: /mnt/tmp
        # Retry loop catches transient infra flakes (ENOSPC blips,
        # cachix 5xx, KVM hiccups) without needing a manual rerun.
        # Backoff: 15 s after attempt 1, 30 s after attempt 2 — short
        # enough to fit inside CI patience, long enough that a brief
        # cache outage recovers before retry. Failures still bubble
        # up on the third attempt, so genuine bugs aren't masked.
        run: |
          set -uo pipefail
          attempts=3
          for i in $(seq 1 $attempts); do
            echo "::group::vm-${{ matrix.lane }} attempt $i/$attempts"
            df -h / /mnt /tmp 2>/dev/null || df -h / || true
            if nix build .#checks.x86_64-linux.vm-${{ matrix.lane }} -L; then
              echo "::endgroup::"
              echo "vm-${{ matrix.lane }} succeeded on attempt $i"
              exit 0
            fi
            rc=$?
            echo "::endgroup::"
            echo "::warning::vm-${{ matrix.lane }} attempt $i failed (rc=$rc)"
            df -h / /mnt /tmp 2>/dev/null || df -h / || true
            if [ "$i" -lt "$attempts" ]; then
              sleep $((i * 15))
            fi
          done
          echo "::error::vm-${{ matrix.lane }} failed after $attempts attempts"
          exit 1
      - name: Disk after (post-build)
        if: always() && needs.preflight.outputs.risk != 'TRIVIAL'
        run: df -h / /mnt /tmp 2>/dev/null || df -h /

  vm-graphical:
    name: vm-graphical
    runs-on: ubuntu-latest
    needs: [verify-fork-guards, preflight]
    permissions:
      contents: read
    # Path-conditional: only runs when desktop-affecting files change.
    # Docs-only PRs naturally skip via this gate, so the job completes
    # SUCCESS-with-no-work for branch protection. The TRIVIAL gate is
    # also redundant here (path filter is stricter) but kept for
    # uniformity with the other heavy jobs.
    steps:
      - if: |
