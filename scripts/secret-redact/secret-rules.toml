# Secret-detection rules for `secret-redact`: gitleaks defaults + formats gitleaks lacks.
#
# Consumed by `gitleaks dir --config <this file>` (secret_redact.py). `useDefault` pulls in
# every rule shipped with the pinned gitleaks (8.30: ~220 providers, incl. all six
# GitHub token types, Anthropic api03/admin01, OpenAI, Slack, HF, Google AIza).
#
# Sources (2026-10-11 research, reports in ~/Repos/research-agent/reports/
# d8895e18117543938438b2d834ade3ff.md and 83bf06105dc94258b6394ab69e66e829.md):
#   cloudflare-*-v2   TruffleHog pkg/detectors/cloudflare{apitoken,globalapikey}/v2
#   google-oauth-client-secret  GitLab secrets analyzer commit 63743045
#   tavily-api-key    no public spec; shape observed locally (tvly-dev- + 32..50)
#   anthropic-oauth-token, fireworks-api-key  no public spec; prefix-anchored, loose body
#
# Prefix rules without a vendor-fixed length (tavily, fireworks, anthropic-oauth)
# START at a token boundary, not `\b`: `\b` holds after `/` or `+`, so the prefix
# fired inside base64 blobs (8 `fw_` hits in Codex encrypted reasoning,
# full-transcript scan 2026-10-11). The prefix must follow start-of-line or a
# character outside [A-Za-z0-9+/_-] (`=` stays allowed: `KEY=fw_...`), and the body
# is length-bounded. Every rule ENDS with the zero-width `\b`, never a consumed
# character: gitleaks matches without overlap, so a consumed separator could not
# also start the next token, and "tokA tokB" lost tokB.
# Providers with no distinctive prefix (Exa, Fish Audio, Auphonic, Lakera, Hetzner,
# eBay, Tradera, EUIPO; Cachix tokens are JWTs and hit the default `jwt` rule) are
# only caught by the default keyword-proximity `generic-api-key` rule.

title = "agent output redaction rules"

[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token-v2"
description = "Cloudflare scannable user/account API token (cfut_/cfat_)"
regex = '''\b(cf[ua]t_[a-zA-Z0-9]{40}[a-fA-F0-9]{8})\b'''
keywords = ["cfut_", "cfat_"]

[[rules]]
id = "cloudflare-global-api-key-v2"
description = "Cloudflare scannable global API key (cfk_)"
regex = '''\b(cfk_[a-zA-Z0-9]{40}[a-fA-F0-9]{8})\b'''
keywords = ["cfk_"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\b(GOCSPX-[a-zA-Z0-9_-]{28})\b'''
keywords = ["gocspx-"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth token (Claude subscription login)"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(sk-ant-oat\d{2}-[a-zA-Z0-9_-]{40,128})\b'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(tvly-(?:dev-|prod-)?[a-zA-Z0-9_-]{30,64})\b'''
keywords = ["tvly-"]

[[rules]]
id = "fireworks-api-key"
description = "Fireworks AI API key"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(fw_[a-zA-Z0-9]{20,48})\b'''
keywords = ["fw_"]

# What the former hand-written regex floors (Claude Code hooks, aggregator)
# caught and gitleaks' defaults miss: known prefixes with any body length
# (truncated, hand-made or older tokens; gitleaks pins exact lengths), and the
# tail of a private key whose BEGIN line is not in view (a BEGIN without its END
# is found by secret_redact.py on the whole text). RE2 keeps every rule linear.
[[rules]]
id = "known-prefix-token"
description = "Token with a known provider prefix, any body length"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(gh[pousr]_[a-zA-Z0-9]{20,}|github_pat_[a-zA-Z0-9_]{30,}|sk-ant-[a-zA-Z0-9_-]{20,}|sk-(?:proj|svcacct|admin)-[a-zA-Z0-9_-]{20,}|sk-[a-zA-Z0-9]{20,}|xox[baprs]-[a-zA-Z0-9-]{10,}|tvly-[a-zA-Z0-9_-]{20,}|cf(?:ut|at|k)_[a-zA-Z0-9]{40,}|GOCSPX-[a-zA-Z0-9_-]{20,}|AKIA[0-9A-Z]{16}|eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,})'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_", "github_pat_", "sk-", "xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-", "tvly-", "cfut_", "cfat_", "cfk_", "gocspx-", "akia", "eyj"]

[[rules]]
id = "private-key-tail"
description = "Private-key body and END line whose BEGIN line is not in view (the last body line, or a PGP =CRC line, may be short)"
regex = '''(?:[A-Za-z0-9+/=]{16,}\s*)+(?:[A-Za-z0-9+/=]{1,15}\s*)?-----END[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key"]
